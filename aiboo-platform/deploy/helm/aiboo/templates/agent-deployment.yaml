apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiboo-agent
  labels:
    app.kubernetes.io/name: aiboo-agent
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: aiboo
    app.kubernetes.io/component: agent
spec:
  replicas: {{ .Values.agent.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: aiboo-agent
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aiboo-agent
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: aiboo
        app.kubernetes.io/component: agent
    spec:
      {{- if .Values.global.imagePullSecret }}
      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecret }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: agent
          image: "{{ .Values.global.imageRegistry }}{{ .Values.agent.image }}:{{ .Values.agent.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8001
          env:
            - name: API_HOST
              value: 0.0.0.0
            - name: API_PORT
              value: "8001"
            - name: NODE_BACKEND
              value: http://aiboo-backend:4000
            - name: REMOTE_URL
              value: http://aiboo-backend:4000
            - name: ENDPOINT_NAME
              value: {{ .Values.agent.endpointName }}
            - name: RUN_ORCHESTRATOR
              value: {{ .Values.agent.runOrchestrator | quote }}
            - name: ENABLE_COMMAND_DASHBOARD
              value: {{ .Values.agent.enableCommandDashboard | quote }}
            - name: ENABLE_AUTONOMOUS_RESPONSE
              value: {{ .Values.agent.enableAutonomousResponse | quote }}
            - name: ENABLE_REAL_RESPONSE
              value: {{ .Values.agent.enableRealResponse | quote }}
            - name: AGENT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.secretName }}
                  key: agentApiKey
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.secretName }}
                  key: internalApiKey
            - name: AIBOO_ENV
              value: production
            - name: ALERT_QUEUE_DB_PATH
              value: /app/queue/alerts_queue.db
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: {{ .Values.agent.resources.requests.cpu }}
              memory: {{ .Values.agent.resources.requests.memory }}
            limits:
              cpu: {{ .Values.agent.resources.limits.cpu }}
              memory: {{ .Values.agent.resources.limits.memory }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          {{- if .Values.agent.queueStorage.enabled }}
          volumeMounts:
            - name: agent-queue
              mountPath: /app/queue
          {{- end }}
      {{- if .Values.agent.queueStorage.enabled }}
      volumes:
        - name: agent-queue
          persistentVolumeClaim:
            claimName: aiboo-agent-queue
      {{- end }}
