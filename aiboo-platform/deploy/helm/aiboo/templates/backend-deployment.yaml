apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiboo-backend
  labels:
    app.kubernetes.io/name: aiboo-backend
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: aiboo
    app.kubernetes.io/component: backend
spec:
  {{- if .Values.backend.hpa.enabled }}
  # HPA controls replica count when enabled
  {{- else }}
  replicas: {{ .Values.backend.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: aiboo-backend
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aiboo-backend
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: aiboo
        app.kubernetes.io/component: backend
    spec:
      {{- if .Values.global.imagePullSecret }}
      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecret }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: backend
          image: "{{ .Values.global.imageRegistry }}{{ .Values.backend.image }}:{{ .Values.backend.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "4000"
            {{- if .Values.backend.mongoUri }}
            - name: MONGO_URI
              value: {{ .Values.backend.mongoUri }}
            {{- else }}
            - name: MONGO_URI
              value: mongodb://aiboo-mongo:27017/aiboo
            {{- end }}
            {{- if .Values.redis.enabled }}
            - name: REDIS_URL
              value: redis://aiboo-redis:6379
            {{- end }}
            {{- if .Values.backend.corsOrigins }}
            - name: CORS_ORIGINS
              value: {{ .Values.backend.corsOrigins }}
            {{- end }}
            - name: TRUST_PROXY
              value: "1"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.secretName }}
                  key: jwtSecret
            - name: AGENT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.secretName }}
                  key: agentApiKey
            - name: API_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.secretName }}
                  key: apiKeys
            - name: CV_INGEST_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.secretName }}
                  key: cvIngestKey
            - name: AGENT_SERVICE_URL
              value: http://aiboo-agent:8001
            - name: CV_SERVICE_URL
              value: http://aiboo-cv:5050
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: {{ .Values.backend.resources.requests.cpu }}
              memory: {{ .Values.backend.resources.requests.memory }}
            limits:
              cpu: {{ .Values.backend.resources.limits.cpu }}
              memory: {{ .Values.backend.resources.limits.memory }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
