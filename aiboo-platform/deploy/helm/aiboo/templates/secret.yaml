{{- if .Values.auth.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.auth.secretName }}
  labels:
    app.kubernetes.io/name: aiboo-secrets
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: aiboo
  annotations:
    # Rotate by re-running helm upgrade with new values.
    aiboo.io/secret-kind: platform-shared-secrets
type: Opaque
stringData:
  jwtSecret: {{ .Values.auth.jwtSecret }}
  agentApiKey: {{ .Values.auth.agentApiKey }}
  internalApiKey: {{ .Values.auth.internalApiKey }}
  apiKeys: {{ .Values.auth.apiKeys }}
  cvIngestKey: {{ .Values.auth.cvIngestKey }}
  cvAuthToken: {{ .Values.auth.cvAuthToken }}
{{- end }}
