{{- if .Values.mongo.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: aiboo-mongo
  labels:
    app.kubernetes.io/name: aiboo-mongo
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: aiboo
    app.kubernetes.io/component: database
spec:
  serviceName: aiboo-mongo
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aiboo-mongo
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aiboo-mongo
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: aiboo
        app.kubernetes.io/component: database
    spec:
      securityContext:
        # official mongo image: root entrypoint fixes perms then drops to
        # the mongodb user (uid 999); fsGroup makes the PVC writable
        fsGroup: 999
      containers:
        - name: mongo
          image: {{ .Values.mongo.image }}
          imagePullPolicy: IfNotPresent
          args: ["--bind_ip_all"]
          ports:
            - name: mongo
              containerPort: 27017
          livenessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
        labels:
          app.kubernetes.io/name: aiboo-mongo
          app.kubernetes.io/instance: {{ .Release.Name }}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.mongo.storage.storageClassName }}
        storageClassName: {{ .Values.mongo.storage.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.mongo.storage.size }}
{{- end }}
