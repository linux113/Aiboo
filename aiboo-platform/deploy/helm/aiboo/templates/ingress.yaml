{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aiboo
  labels:
    app.kubernetes.io/name: aiboo
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: aiboo
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          # Single backend: the frontend nginx proxies /api, /socket.io,
          # /cv-api, /agent-api to the in-cluster services (same-origin).
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aiboo-frontend
                port:
                  number: 5173
{{- end }}
