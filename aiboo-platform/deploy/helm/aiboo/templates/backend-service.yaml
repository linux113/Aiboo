apiVersion: v1
kind: Service
metadata:
  name: aiboo-backend
  labels:
    app.kubernetes.io/name: aiboo-backend
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: aiboo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: aiboo-backend
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 4000
      targetPort: http
