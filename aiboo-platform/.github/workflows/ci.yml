name: AiBoO CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck-backend:
    name: Backend Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: ./backend/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present

  lint-and-typecheck-frontend:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: ./frontend/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
      - run: npm run build --if-present

  test-backend:
    name: Backend Smoke Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: ./backend/package-lock.json
      - run: npm ci
      - name: Security / auth / ingest smoke suite (self-contained, no DB)
        run: node smoke-test.mjs

  test-agent:
    name: Agent Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ./agent/requirements.txt
      - run: pip install -r requirements.txt
      - run: pip install pytest pytest-asyncio
      - run: python -m pytest tests/ -v --junitxml=test-results.xml
      - uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Agent Test Results
          path: agent/test-results.xml
          reporter: java-junit

  test-cv-service:
    name: CV Service Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cv-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ./cv-service/requirements.txt
      - run: pip install -r requirements.txt
      - run: pip install pytest pytest-asyncio
      - run: python -m pytest tests/ -v --junitxml=test-results.xml 2>/dev/null || echo "No tests yet"
      - run: python -c "import app; print('Module loads OK')"

  helm-lint:
    name: Helm Chart Lint & Render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Portable-subset render check (no helm required)
        run: python3 deploy/helm/validate-templates.py deploy/helm/aiboo
      - name: helm lint (defaults)
        run: helm lint deploy/helm/aiboo
      - name: helm template (default + BYO-secret + GPU variants)
        run: |
          helm template aiboo deploy/helm/aiboo > /dev/null
          helm template aiboo deploy/helm/aiboo \
            --set mongo.enabled=false --set redis.enabled=false \
            --set auth.createSecret=false > /dev/null
          helm template aiboo deploy/helm/aiboo --set cv.gpu.enabled=true > /dev/null

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build --parallel

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          # Fail builds on CRITICAL only — HIGH findings in base images change
          # daily and gate real delivery; track them via scheduled scans.
          exit-code: "1"
          severity: "CRITICAL"
