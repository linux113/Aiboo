version: "3.9"

# ─────────────────────────────────────────────────────────────────────
# Secrets are interpolated from a root-level .env file (see .env.example).
#   cp .env.example .env   then fill in real values (openssl rand -hex 32).
# NEVER commit the real .env.
# ─────────────────────────────────────────────────────────────────────

services:
  mongodb:
    image: mongo:7
    container_name: aiboo-mongodb
    restart: unless-stopped
    # Bind DB to loopback only — never expose Mongo on a public interface.
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - aiboo-net
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional but recommended for production: cluster-wide token revocation +
  # rate limiting. Start with:  docker compose --profile redis up -d
  redis:
    image: redis:7-alpine
    container_name: aiboo-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    profiles: ["redis"]
    volumes:
      - redis_data:/data
    networks:
      - aiboo-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aiboo-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=4000
      - MONGO_URI=mongodb://mongodb:27017/aiboo
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_TTL=${JWT_ACCESS_TTL:-1h}
      - JWT_REFRESH_TTL=${JWT_REFRESH_TTL:-7d}
      - REDIS_URL=${REDIS_URL:-}
      - DETECTION_RETENTION_DAYS=${DETECTION_RETENTION_DAYS:-90}
      - AGENT_API_KEY=${AGENT_API_KEY}
      - API_KEYS=${API_KEYS}
      - CV_INGEST_KEY=${CV_INGEST_KEY}
      - OPENAI_KEY=${OPENAI_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173}
      - AGENT_SERVICE_URL=http://agent:8001
      - CV_SERVICE_URL=http://cv-service:5050
      - TRUST_PROXY=1
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SEED_DEMO_DATA=${SEED_DEMO_DATA:-false}
    networks:
      - aiboo-net
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/health', r => { process.exit(r.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Vite bakes these at BUILD time — same-origin relative URLs so the SPA
      # works on any host/domain/tunnel without rebuilds.
      args:
        VITE_API_URL: /api
        VITE_SOCKET_URL: ""
        VITE_CV_URL: /cv-api
        VITE_AGENT_URL: /agent-api
    container_name: aiboo-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      # Consumed by the nginx template (envsubst) at container start
      - BACKEND_HOST=backend
      - AGENT_HOST=agent
      - CV_HOST=cv-service
      - CV_AUTH_TOKEN=${CV_AUTH_TOKEN}
    networks:
      - aiboo-net

  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: aiboo-agent
    restart: unless-stopped
    ports:
      - "8001:8001"
    depends_on:
      - backend
    environment:
      - API_PORT=8001
      - API_HOST=0.0.0.0
      - NODE_BACKEND=http://backend:4000
      - REMOTE_URL=http://backend:4000
      - ENDPOINT_NAME=${ENDPOINT_NAME:-aiboo-agent-docker}
      - AGENT_API_KEY=${AGENT_API_KEY}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - AIBOO_ENV=${AIBOO_ENV:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DB_TYPE=memory
      # true = full tri-gate orchestrator inside the container (recommended for
      # prod on Linux; Windows Event Log ingestion auto-disables and events
      # arrive via the API). false = lightweight ingestion API only.
      - RUN_ORCHESTRATOR=${RUN_ORCHESTRATOR:-true}
      # Action engines are opt-in — they kill processes / lock hosts.
      - ENABLE_COMMAND_DASHBOARD=${ENABLE_COMMAND_DASHBOARD:-true}
      - ENABLE_AUTONOMOUS_RESPONSE=${ENABLE_AUTONOMOUS_RESPONSE:-false}
      - ENABLE_REAL_RESPONSE=${ENABLE_REAL_RESPONSE:-false}
      # SQLite offline queue lives on the mounted volume
      - ALERT_QUEUE_DB_PATH=/app/queue/alerts_queue.db
    volumes:
      # Persist the offline alert queue across container restarts
      - agent_queue:/app/queue
    # NOTE: ALERT_QUEUE_DB_PATH is set here so the SQLite queue lands on the volume
    # (path is also read in core/alert_queue.py)
    networks:
      - aiboo-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  cv-service:
    build:
      context: ./cv-service
      dockerfile: Dockerfile
    container_name: aiboo-cv
    restart: unless-stopped
    ports:
      - "5050:5050"
    depends_on:
      - backend
    environment:
      - CV_HOST=0.0.0.0
      - NODE_BACKEND=http://backend:4000
      - CV_AUTH_TOKEN=${CV_AUTH_TOKEN}
      # Must match backend CV_INGEST_KEY — authenticates detection posts
      - CV_INGEST_KEY=${CV_INGEST_KEY}
      # Accelerated inference (optional): exported model + cuda device
      # - YOLO_MODEL_PATH=/app/models/yolov8n.engine
      # - YOLO_DEVICE=0
      - FRONTEND_ORIGIN=${CORS_ORIGINS:-http://localhost:5173}
    volumes:
      - cv_models:/app/models
    networks:
      - aiboo-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5050/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mongo_data:
  redis_data:
  cv_models:
  agent_queue:

networks:
  aiboo-net:
    driver: bridge
